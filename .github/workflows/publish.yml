name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v6
      # Fail before building if the release tag disagrees with package.json.
      # Without this, a mismatched tag reaches `npm publish`, which either
      # rejects a duplicate version or publishes the wrong one.
      - name: Verify the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          EXPECTED="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Release tag '$TAG' does not match package.json ('$EXPECTED')."
            exit 1
          fi
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
      # Trusted Publishing (OIDC) — no NPM_TOKEN. npm >= 11.5.1 exchanges the
      # GitHub Actions id-token for a short-lived credential and attaches
      # provenance automatically. Requires a Trusted Publisher configured for
      # this package on npmjs.com (repo + workflow file).
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
